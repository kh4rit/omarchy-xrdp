# Installed by omarchy-xrdp: xrdp silently drops any H.264 frame that
# compresses to more than 3 MB, and the client then decodes every following
# frame against a picture it never got (green, smeared blocks until the
# area is redrawn). A full-screen change at 4K can exceed that, so allow
# up to 32 MB, more than any 4K frame needs.
[Service]
Environment=XRDP_GFX_MAX_COMPRESSED_BYTES=33554432
